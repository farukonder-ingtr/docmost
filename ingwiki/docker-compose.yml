services:

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped

    ports:
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

    depends_on:
      - docmost

    networks:
      - frontend
      - backend


  docmost:
    build:
      # docker-compose.yml now lives inside docmost/ingwiki/, and the
      # Docmost OSS Dockerfile is the parent repo root (one level up).
      context: ..
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      APP_URL: https://ingwiki
      DATABASE_URL: postgresql://docmost:${DOCMOST_DB_PASSWORD}@docmost-postgres:5432/docmost
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${DOCMOST_APP_SECRET}

      AUTHZ_URL: http://authz:8080
      DOCMOST_INTERNAL_SECRET: ${DOCMOST_INTERNAL_SECRET}

    depends_on:
      docmost-postgres:
        condition: service_healthy
      redis:
        condition: service_started
      authz:
        condition: service_started

    networks:
      - backend


  authz:
    build:
      context: ./authz
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      LDAP_URL: ${LDAP_URL}
      LDAP_BASE_DN: ${LDAP_BASE_DN}

      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}

      LDAP_USER_SEARCH_BASE: ${LDAP_USER_SEARCH_BASE}
      LDAP_USER_SEARCH_FILTER: ${LDAP_USER_SEARCH_FILTER}

      LDAP_GROUP_SEARCH_BASE: ${LDAP_GROUP_SEARCH_BASE}
      LDAP_GROUP_SEARCH_FILTER: ${LDAP_GROUP_SEARCH_FILTER}

      DOCMOST_INTERNAL_SECRET: ${DOCMOST_INTERNAL_SECRET}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      redis:
        condition: service_started
      ldap:
        condition: service_healthy

    networks:
      - backend


  docmost-postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DOCMOST_DB_PASSWORD}

    volumes:
      - docmost-postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmost -d docmost"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend


  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis:/data

    networks:
      - backend


  # --- Test/dev LDAP directory (NOT for production — swap for real LDAPS/AD) ---
  ldap:
    image: osixia/openldap:1.5.0
    container_name: placeholder-test-ldap
    environment:
      LDAP_ORGANISATION: "placeholder Test"
      LDAP_DOMAIN: "placeholder.test"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_TLS: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    ports:
      - "389:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -D 'cn=admin,dc=placeholder,dc=test' -w admin -b 'dc=placeholder,dc=test' '(objectClass=*)' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - backend

  ldap-seed:
    image: osixia/openldap:1.5.0
    container_name: placeholder-test-ldap-seed
    entrypoint: ["/bin/bash", "/seed/seed.sh"]
    depends_on:
      ldap:
        condition: service_healthy
    volumes:
      - ./test/ldap/bootstrap/test.ldif:/seed/raw.ldif:ro
      - ./test/ldap/seed.sh:/seed/seed.sh:ro
    restart: "no"
    networks:
      - backend


volumes:
  docmost-postgres:
  redis:


networks:
  frontend:
  backend:
    internal: true
